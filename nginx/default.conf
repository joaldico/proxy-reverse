# -------------------------------------------------------
# HTTP → HTTPS (dominios con certificado)
# -------------------------------------------------------
server {
    if ($host = www.enterprisesolutionstech.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = enterprisesolutionstech.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name enterprisesolutionstech.com www.enterprisesolutionstech.com;
    return 404;
}

server {
    if ($host = www.jessirecrea.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = jessirecrea.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name jessirecrea.com www.jessirecrea.com;
    return 404;
}


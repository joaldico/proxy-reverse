# CORS for the notifications API (same Spring app behind several domains)
map $http_origin $cors_origin {
    default "";
    "https://enterprisesolutionstech.com" $http_origin;
    "https://www.enterprisesolutionstech.com" $http_origin;
    "https://jessirecrea.com" $http_origin;
    "https://www.jessirecrea.com" $http_origin;
    "https://josuediazcontreras.com" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:3001" $http_origin;
}

# -------------------------------------------------------
# ENTERPRISE SOLUTIONS (JOSUE)
# -------------------------------------------------------
server {
    server_name enterprisesolutionstech.com www.enterprisesolutionstech.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style id="est-hero-fix">.controlPrev,.controlNext,.swiper-pagination,.swiper-button-next,.swiper-button-prev{display:none!important}.swiper-wrapper{transform:none!important;transition:none!important}.swiper-slide:not(:first-child){display:none!important}</style></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location /notifications {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/enterprisesolutionstech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enterprisesolutionstech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# -------------------------------------------------------
# JESSICA — jessirecrea.com (proyecto nuevo jessica-web)
# -------------------------------------------------------
server {
    server_name jessirecrea.com www.jessirecrea.com;

    location /notifications {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jessirecrea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jessirecrea.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# -------------------------------------------------------
# JOSUÉ — josuediazcontreras.com
# -------------------------------------------------------
server {
    listen 80;
    server_name josuediazcontreras.com www.josuediazcontreras.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name josuediazcontreras.com www.josuediazcontreras.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/josuediazcontreras.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/josuediazcontreras.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

